[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kanbanTUI"
dynamic = ["version"]
description = "Terminal personal Kanban board"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pascal Rothe", email = "ibirothe@gmail.com" },
]
maintainers = [
    { name = "Pascal Rothe", email = "ibirothe@gmail.com" },
]
keywords = ["kanban", "cli", "tui", "productivity"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Click>=8.0.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
kanban-tui = "kanban_tui.cli:main"

[project.urls]
Repository = "https://github.com/ibirothe/kanbanTUI"
Issues = "https://github.com/ibirothe/kanbanTUI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src/kanban_tui"]
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["kanban_tui"]

[tool.coverage.report]
show_missing = true
skip_covered = true
